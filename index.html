<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sukhan | Join the reading circle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <main class="container-fluid">
    <div class="row">

      <!-- LEFT: visual (on mobile it comes first, as a banner) -->
      <section class="col-lg-5 p-0 align-self-lg-start visual-panel">
        <img src="images/book.jpg" alt="Open book with reading glasses and dried flowers" class="visual-img">
      </section>

      <!-- RIGHT: form -->
      <section class="col-lg-7 form-side">
        <div class="form-wrap w-100">

          <header class="text-center mb-3">
            <img src="images/logo.png" alt="Sukhan" class="logo d-block mx-auto mb-2">
            <h1 class="title">Come, let’s turn a page together.</h1>
            <p class="subtitle">Join the Sukhan reading circle.</p>
          </header>

          <form id="sukhanForm" novalidate>
            <div class="row g-2 g-md-3">

              <div class="col-md-6">
                <label for="name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="name" name="name" required>
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>

              <div class="col-md-6">
                <label for="whatsapp" class="form-label">WhatsApp number</label>
                <input type="tel" class="form-control" id="whatsapp" name="whatsapp" required>
              </div>

              <div class="col-md-6">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" name="city">
              </div>

              <!-- Genres: pick any (checkboxes shown as chips) -->
              <div class="col-12">
                <span class="form-label d-block">Favourite genres</span>
                <div class="d-flex flex-wrap gap-2">
                  <input type="checkbox" class="btn-check" id="g1" name="genres" value="Fiction">
                  <label class="btn btn-outline-secondary btn-sm" for="g1">Fiction</label>

                  <input type="checkbox" class="btn-check" id="g2" name="genres" value="Poetry">
                  <label class="btn btn-outline-secondary btn-sm" for="g2">Poetry</label>

                  <input type="checkbox" class="btn-check" id="g3" name="genres" value="Non-fiction">
                  <label class="btn btn-outline-secondary btn-sm" for="g3">Non-fiction</label>

                  <input type="checkbox" class="btn-check" id="g4" name="genres" value="Classics">
                  <label class="btn btn-outline-secondary btn-sm" for="g4">Classics</label>

                  <input type="checkbox" class="btn-check" id="g5" name="genres" value="Mystery">
                  <label class="btn btn-outline-secondary btn-sm" for="g5">Mystery</label>

                  <input type="checkbox" class="btn-check" id="g6" name="genres" value="Self-growth">
                  <label class="btn btn-outline-secondary btn-sm" for="g6">Self-growth</label>
                </div>
              </div>

              <!-- Language: pick one (radios shown as chips) -->
              <div class="col-md-6">
                <span class="form-label d-block">Reading language</span>
                <div class="d-flex gap-2 flex-nowrap">
                  <input type="radio" class="btn-check" name="language" id="lang1" value="Urdu" required>
                  <label class="btn btn-outline-secondary btn-sm" for="lang1">Urdu</label>

                  <input type="radio" class="btn-check" name="language" id="lang2" value="English">
                  <label class="btn btn-outline-secondary btn-sm" for="lang2">English</label>

                  <input type="radio" class="btn-check" name="language" id="lang3" value="Both">
                  <label class="btn btn-outline-secondary btn-sm" for="lang3">Both</label>
                </div>
              </div>

              <!-- Attendance: pick one or both (checkboxes). Both ticked = "either" -->
              <div class="col-md-6">
                <span class="form-label d-block">How will you join?</span>
                <div class="d-flex gap-2 flex-nowrap">
                  <input type="checkbox" class="btn-check" id="att1" name="attendance" value="In-person">
                  <label class="btn btn-outline-secondary btn-sm" for="att1">In-person</label>

                  <input type="checkbox" class="btn-check" id="att2" name="attendance" value="Online">
                  <label class="btn btn-outline-secondary btn-sm" for="att2">Online</label>
                </div>
              </div>

              <div class="col-12">
                <label for="book" class="form-label">Currently reading / favourite book <span class="optional">(optional)</span></label>
                <input type="text" class="form-control" id="book" name="book">
              </div>

              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-sukhan w-100">Join the circle</button>
              </div>

            </div>
          </form>

        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
