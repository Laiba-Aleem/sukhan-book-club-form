<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sukhan | Join the reading circle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <main class="container-fluid min-vh-100">
    <div class="row min-vh-100">

      <!-- LEFT: visual (on mobile this comes first, as a banner) -->
      <section class="col-lg-5 p-0">
        <img src="images/book.jpg" alt="Open book with reading glasses and dried flowers"
             class="w-100 h-100 object-fit-cover" style="min-height: 220px; max-height: 100vh;">
      </section>

      <!-- RIGHT: form -->
      <section class="col-lg-7 d-flex align-items-center">
        <div class="w-100 p-4 p-md-5" style="max-width: 640px; margin: 0 auto;">

          <img src="images/logo.jpeg" alt="Sukhan" width="140" class="mb-4">
          <h1 class="h3">Join the reading circle</h1>
          <p class="text-secondary mb-4">Tell us a little about yourself.</p>

          <form id="sukhanForm" novalidate>
            <div class="row g-3">

              <div class="col-12">
                <label for="name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="name" name="name" required>
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>

              <div class="col-md-6">
                <label for="whatsapp" class="form-label">WhatsApp number</label>
                <input type="tel" class="form-control" id="whatsapp" name="whatsapp" required>
              </div>

              <div class="col-12">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" name="city">
              </div>

              <div class="col-12">
                <span class="form-label d-block">Favourite genres</span>
                <div class="d-flex flex-wrap gap-2">
                  <input type="checkbox" class="btn-check" id="g1" name="genres" value="Fiction">
                  <label class="btn btn-outline-secondary btn-sm" for="g1">Fiction</label>

                  <input type="checkbox" class="btn-check" id="g2" name="genres" value="Poetry">
                  <label class="btn btn-outline-secondary btn-sm" for="g2">Poetry</label>

                  <input type="checkbox" class="btn-check" id="g3" name="genres" value="Non-fiction">
                  <label class="btn btn-outline-secondary btn-sm" for="g3">Non-fiction</label>

                  <input type="checkbox" class="btn-check" id="g4" name="genres" value="Classics">
                  <label class="btn btn-outline-secondary btn-sm" for="g4">Classics</label>

                  <input type="checkbox" class="btn-check" id="g5" name="genres" value="Mystery">
                  <label class="btn btn-outline-secondary btn-sm" for="g5">Mystery</label>

                  <input type="checkbox" class="btn-check" id="g6" name="genres" value="Self-growth">
                  <label class="btn btn-outline-secondary btn-sm" for="g6">Self-growth</label>
                </div>
              </div>

              <div class="col-md-6">
                <span class="form-label d-block">Reading language</span>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="language" id="lang1" value="Urdu" required>
                  <label class="form-check-label" for="lang1">Urdu</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="language" id="lang2" value="English">
                  <label class="form-check-label" for="lang2">English</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="language" id="lang3" value="Both">
                  <label class="form-check-label" for="lang3">Both</label>
                </div>
              </div>

              <div class="col-md-6">
                <span class="form-label d-block">How will you join?</span>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="attendance" id="att1" value="In-person" required>
                  <label class="form-check-label" for="att1">In-person</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="attendance" id="att2" value="Online">
                  <label class="form-check-label" for="att2">Online</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="attendance" id="att3" value="Either">
                  <label class="form-check-label" for="att3">Either</label>
                </div>
              </div>

              <div class="col-12">
                <label for="book" class="form-label">Currently reading / favourite book <span class="text-secondary">(optional)</span></label>
                <input type="text" class="form-control" id="book" name="book">
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-dark w-100 py-2">Reserve my place</button>
              </div>

            </div>
          </form>

        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
